name: visual-baselines

# ADR-0008: baselines are rendered by this linux runner and never on a developer
# mac. Dispatch with `update: true` to re-render them and download the artifact
# to commit; dispatch with the default to run the comparison on demand.
on:
  workflow_dispatch:
    inputs:
      update:
        description: 'Re-render the baselines (--update-snapshots) instead of comparing'
        type: boolean
        default: false

jobs:
  visual-baselines:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentproofarch
          POSTGRES_PASSWORD: agentproofarch
          POSTGRES_DB: agentproofarch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentproofarch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 47925:1025
          - 47980:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 'true'
          MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    env:
      DATABASE_URL: postgresql://agentproofarch:agentproofarch@localhost:5432/agentproofarch
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build:web
      # Playwright reports a newly written snapshot as a failed test, so the
      # authoring run itself cannot gate the upload that carries the PNGs out of
      # CI. The comparison below gates it instead: it re-renders against what was
      # just written, so an authoring run that died before the harness booted
      # cannot ship an empty or partial artifact as a baseline set.
      - if: inputs.update
        run: pnpm run visual:update
        continue-on-error: true
      - if: inputs.update
        run: pnpm run visual
      - if: inputs.update
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: visual/__screenshots__
          retention-days: 7
      - if: ${{ !inputs.update }}
        run: pnpm run visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: visual-diff
          path: test-results
          retention-days: 7
