name: post-deploy-smoke

on:
  deployment_status:

concurrency:
  group: post-deploy-smoke-${{ github.event.deployment.environment }}-${{ github.event.deployment.sha }}
  cancel-in-progress: false

jobs:
  smoke-remote:
    # Preview deployments sit behind Vercel Authentication, whose SSO
    # interstitial fails the cache-header assertions — only Production is
    # publicly reachable for an unauthenticated smoke.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run smoke:remote
        env:
          BASE_URL: ${{ github.event.deployment.environment == 'Production' && 'https://docu-signer-nine.vercel.app' || github.event.deployment_status.environment_url }}
          EXPECTED_SHA: ${{ github.event.deployment.sha }}
