name: post-deploy-smoke

on:
  deployment_status:

concurrency:
  group: post-deploy-smoke-${{ github.event.deployment.environment }}-${{ github.event.deployment.environment == 'Production' && 'shared' || github.event.deployment.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke-remote:
    # Preview deployments sit behind Vercel Authentication, whose SSO
    # interstitial fails the cache-header assertions — only Production is
    # publicly reachable for an unauthenticated smoke.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify deployment belongs to main
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
            echo "Production deployment SHA $DEPLOY_SHA is not an ancestor of origin/main." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run smoke:remote
        env:
          BASE_URL: ${{ github.event.deployment.environment == 'Production' && 'https://docu-signer-nine.vercel.app' || github.event.deployment_status.environment_url }}
          EXPECTED_SHA: ${{ github.event.deployment.sha }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_TENANT: ${{ secrets.SMOKE_TENANT }}
      - name: Check browser-probe credentials
        id: probe-creds
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          if [ -n "$SMOKE_EMAIL" ] && [ -n "$SMOKE_PASSWORD" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Browser probe UNARMED::Production browser login was NOT probed - set the SMOKE_EMAIL and SMOKE_PASSWORD repository secrets to a dedicated probe account to close the browser/2FA blind spot (P0 incident 2026-08-10)."
          fi
      - name: Install Chromium
        if: steps.probe-creds.outputs.armed == 'true'
        run: pnpm exec playwright install chromium --with-deps
      - name: Probe production browser login
        if: steps.probe-creds.outputs.armed == 'true'
        run: pnpm run probe:browser
        env:
          BASE_URL: ${{ github.event.deployment.environment == 'Production' && 'https://docu-signer-nine.vercel.app' || github.event.deployment_status.environment_url }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_TOTP_SECRET: ${{ secrets.SMOKE_TOTP_SECRET }}
