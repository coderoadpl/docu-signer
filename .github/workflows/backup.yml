name: backup

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docu-signer-nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Detect backup configuration
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
          BLOB_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GOOGLE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER: ${{ vars.GOOGLE_DRIVE_FOLDER_ID || secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$BLOB_TOKEN" ] && [ -n "$GOOGLE_ACCOUNT" ] && [ -n "$DRIVE_FOLDER" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain unconfigured skip
        if: steps.preflight.outputs.has_secrets != 'true'
        run: echo "::notice::Backup skipped because NEON_DATABASE_URL_UNPOOLED, BLOB_READ_WRITE_TOKEN, GOOGLE_SERVICE_ACCOUNT_JSON, or GOOGLE_DRIVE_FOLDER_ID is not configured."

      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        if: steps.preflight.outputs.has_secrets == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.preflight.outputs.has_secrets == 'true'
        with:
          package_json_file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.preflight.outputs.has_secrets == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install backup tools
        if: steps.preflight.outputs.has_secrets == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client unzip zip
          pnpm install --frozen-lockfile

      - name: Create and publish backup
        if: steps.preflight.outputs.has_secrets == 'true'
        env:
          NEON_DATABASE_URL_UNPOOLED: ${{ secrets.NEON_DATABASE_URL_UNPOOLED }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID || secrets.GOOGLE_DRIVE_FOLDER_ID }}
          BACKUP_BLOB_MONTHLY_DOWNLOAD_LIMIT_BYTES: ${{ vars.BACKUP_BLOB_MONTHLY_DOWNLOAD_LIMIT_BYTES || '5000000000' }}
          BACKUP_DATABASE_DAILY_MAX_BYTES: ${{ vars.BACKUP_DATABASE_DAILY_MAX_BYTES || '100000000' }}
        run: pnpm exec tsx scripts/backup.ts
