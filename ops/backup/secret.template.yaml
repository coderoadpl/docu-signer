# Key reference only — never apply or populate this file. The live Secret is
# built from root-only files with `kubectl create secret --from-env-file`
# (see README.md), so no populated copy can be committed by accident.
apiVersion: v1
kind: Secret
metadata:
  name: agentproofarch-backup-secrets
  namespace: agentproofarch-backup
type: Opaque
stringData:
  DATABASE_URL: postgresql://USER:PASSWORD@NEON_HOST/DATABASE?sslmode=require
  backup-passphrase: REPLACE_WITH_A_LONG_RANDOM_PASSPHRASE
  S3_PROVIDER: Other
  S3_ENDPOINT: https://S3_ENDPOINT
  S3_REGION: REPLACE_WITH_REGION
  S3_ACCESS_KEY_ID: REPLACE_WITH_ACCESS_KEY_ID
  S3_SECRET_ACCESS_KEY: REPLACE_WITH_SECRET_ACCESS_KEY
  S3_BUCKET: REPLACE_WITH_BUCKET
  S3_PREFIX: agentproofarch/production
